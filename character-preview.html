<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ทัย — ตัวอย่างท่าเดิน 8 เฟรม</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1512;color:#d3dcc9;font:14px system-ui,sans-serif;text-align:center;padding:30px 20px}h1{font-size:25px;font-weight:500}p{font-size:13px;color:#9caa95}.stage{height:min(62vh,510px);position:relative;max-width:650px;margin:20px auto;border:1px solid #59654b;background:radial-gradient(ellipse at bottom,#354738,#0a1512 75%);overflow:hidden}.sprite{height:95%;aspect-ratio:2/3;background-image:url('assets/thai-walk-striped.png');background-size:400% 200%;background-repeat:no-repeat;margin:2% auto 0;filter:drop-shadow(8px 10px 12px #0008)}button,a{display:inline-block;background:#223729;border:1px solid #849370;padding:11px 16px;color:#d4ddbf;text-decoration:none;margin:4px;cursor:pointer;font:inherit}output{display:block;margin:15px}input{width:min(350px,90%);accent-color:#bfb490}.hint{margin-top:25px;font-size:11px;color:#6d806b}</style></head><body><h1>ทัย — กลับบ้านหลังเลิกกะ</h1><p>ชุดพนักงานเซเว่น · เดินถือโทรศัพท์คุยกับอู๋ · 8 เฟรม</p><div class="stage"><div class="sprite" role="img" aria-label="ตัวละครทัยกำลังเดินในชุดเซเว่น"></div></div><div><button id="previous">← ก่อนหน้า</button><button id="play">หยุดดูเฟรม</button><button id="next">ถัดไป →</button></div><output id="frame" aria-live="polite">เฟรม 1 / 8</output><input id="slider" type="range" min="0" max="7" value="0" aria-label="เลือกเฟรม"><p><a href="assets/thai-walk-striped.png" download>ดาวน์โหลดชุดเฟรม PNG โปร่งใส</a><a href="index.html">เข้าเกม</a></p><p class="hint">ใช้ปุ่มซ้าย–ขวาเพื่อตรวจท่าทางแต่ละเฟรม</p><script>let n=0,playing=true;const sprite=document.querySelector('.sprite'),slider=document.getElementById('slider'),play=document.getElementById('play');function draw(){sprite.style.backgroundPosition=n%4/3*100+'% '+Math.floor(n/4)*100+'%';slider.value=n;document.getElementById('frame').textContent='เฟรม '+(n+1)+' / 8';play.textContent=playing?'หยุดดูเฟรม':'เล่นท่าเดิน'}function step(d){playing=false;n=(n+d+8)%8;draw()}play.onclick=()=>{playing=!playing;draw()};document.getElementById('previous').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);slider.oninput=()=>{playing=false;n=Number(slider.value);draw()};document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')step(-1);if(e.key==='ArrowRight')step(1)});const img=new Image();img.onload=()=>sprite.style.aspectRatio=(img.naturalWidth/4)/(img.naturalHeight/2);img.src='assets/thai-walk-striped.png';setInterval(()=>{if(playing&&!document.hidden){n=(n+1)%8;draw()}},135);</script></body></html>
